<!doctype html>
<html lang="en" data-theme="fresh">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply a saved / previewed style before paint (no flash). See src/lib/theme.ts.
			try {
				var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('pu-theme');
				if (['fresh', 'cozy', 'night', 'bold'].indexOf(t) >= 0) document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
