# Which postup-lifecycle sub-features each current phase delivers.
# Evidence is taken from the mock model (screens, links, events, ways)
# and from notes / HTML that the model does not yet encode as a link.
# The check script fails if a cited screen, link, event, or way is missing,
# or if it is not available in that phase (since/until).

# Stable ids. Phases are the current model ids (aliases still work in the app).
# This file does not change phases.toml semantics.

[[phase]]
id = "post-and-join"
delivers = [
  "lifecycle-view-live",
  "lifecycle-join",
  "lifecycle-host",
  "lifecycle-end-now",
  "lifecycle-time-runs-out",
  "lifecycle-cancelled-view",
]

[[phase]]
id = "share-and-chat"
delivers = [
  "lifecycle-view-live",
  "lifecycle-join",
  "lifecycle-host",
  "lifecycle-end-now",
  "lifecycle-time-runs-out",
  "lifecycle-cancelled-view",
  "lifecycle-leave",
  "lifecycle-extend",
  "lifecycle-fills",
  "lifecycle-share-link-live",
  "lifecycle-share-link-ended",
]

[[phase]]
id = "projects"
delivers = [
  "lifecycle-view-live",
  "lifecycle-join",
  "lifecycle-host",
  "lifecycle-end-now",
  "lifecycle-time-runs-out",
  "lifecycle-cancelled-view",
  "lifecycle-leave",
  "lifecycle-extend",
  "lifecycle-fills",
  "lifecycle-share-link-live",
  "lifecycle-share-link-ended",
  "lifecycle-ask-to-join",
]

# Evidence used by check_mapping.py. kind is screen | link | event | way | note.
# A "note" kind is documented only (no model id to resolve) and must name its source.
# "must_be_available" is the earliest phase in which every cited model item must exist.

[[feature]]
id = "lifecycle-view-live"
must_be_available = "post-and-join"
[[feature.item]]
kind = "screen"
id = "postup"
source = "design/mockups/model/screens/postup.toml"

