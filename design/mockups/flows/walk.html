\" button, and keep the map one tap away for picking a cafe. Once there are live postups, open on the map, since that”", "F030": "Alternate feed-first mock; think about appeal. — Martin, S08-mockups-1 t197u: “yeah make it an alternate mock so I can compare. And think deep about what will be appeaing to people”", "F031": "Consider images in feed. — Martin, S08-mockups-1 t198u: “(like do w eneed images, etc)”", "F032": "Google photos never in feed. — PostUp PM (assistant), S08-mockups-1: “**Google photos stay out of the feed.** Their terms only allow them inside the Google card on a cafe's page.”", "F033": "Optional photo ask after posting. — PostUp PM (assistant), S08-mockups-1: “after someone posts, ask \"Add a photo of your spot?\" as an optional step, so it doesn't slow posting down.”", "F035": "Never say it's quiet. — Martin, S08-mockups-1 t200u: “I don't think we even need to say it's quiet right now btw”", "F043": "First-visit experience required; fall back to projects in general when nothing this week. — Martin, S11 t244u: “the final site doesn't seem like it has the first experience liek we talked about? If there aren't things from this week, we should just show projects in general”", "F044": "No map when no postups; focus on projects. — Martin, S11 t247u: “We weren't supposed to show the map when there's no post ups, we were going to focus on projects.”", "F046": "Tab always called Home. — Martin, S11 t252u: “I think we just always call the map tab home btw”", "F051": "Nearby feed on desktop should not show the map. — Martin, S08-mockups-2 t207u: “huh, but nearby feed with photos on desktop still shows the map?”", "F052": "Projects must not show the map. — Martin, S08-mockups-2 t208u: “why does clicking on projects shwo the map?”", "F053": "Map only on map, cafe and postup screens. — PostUp PM (assistant), S08-mockups-2: “The map now only shows on the map, cafe and postup screens.”", "F055": "Join mode is a per-postup setting by the poster; poster is alerted. — Martin, S08-mockups-2 t210u: “1. That can be a setting on the postup by whoever started it. I did have in mind we'd alert the person starting it.”", "F056": "Where-I'm-sitting note/picture: to-do. — Martin, S08-mockups-2 t210u: “2. You should be able to put a description of where you are or a picture.. let's leave this on the todo list for now”", "F057": "Managing your own postup is important. — Martin, S08-mockups-2 t210u: “3. This is an important one, we should mock it up.”", "F058": "Doubts the map as cafe picker. — Martin, S08-mockups-2 t210u: “idk if a map is the best way? A map is more useful when there is a list of curated good cafes to go to, but we don't have that starting out.”", "F059": "Report and block yes; no safety tips. — Martin, S08-mockups-2 t210u: “5. Reporting and blocking woudl be good to have. Idk about safety tips, this site is for adults and they should be smart enough to understand the risks.”", "F060": "Profile/account needed; fix wrong links; add ended/failed states. — Martin, S08-mockups-2 t210u: “8. yeah we need this, any ideas? 9. sure fix those 10. sure we can add those.”", "F061": "Chat at launch; reason when requesting to join. — Martin, S08-mockups-2 t210u: “and yes, we need chat at launch. I think you can leave a reason why you want to join when requesting to join a postup where approval is required, and there is a chat for people in the postup”", "F062": "Cafe picking via search sheet (agreed). — PostUp PM (assistant), S08-mockups-2: “Posting up opens a \"Where are you?\" sheet that lists nearby cafes by distance, with a search box.”", "F063": "Dismissable first-visit welcome. — PostUp PM (assistant), S08-mockups-2: “A one-line welcome at the top of the feed the first time (\"Post up at a cafe and see who's working nearby\"), which you can dismiss.”", "F065": "Profile contents. — PostUp PM (assistant), S08-mockups-2: “**8. Profile:** your photo and name, a short bio, and your regular cafes.”", "F066": "Agreed to search picker,
