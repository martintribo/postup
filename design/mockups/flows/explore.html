<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site map + states · PostUp mockups</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:13px Inter,system-ui,sans-serif;background:#f4f3ef}.xb{height:40px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#fff;border-bottom:1px solid #e4e2dc}

@media(max-width:820px){.sp2{flex-direction:column;height:auto}#L{width:100%!important;height:55vh}#R{height:100vh}.gut{display:none}}.ocv-all,.ocv-smallest,.ocv-pre-mvp,.ocv-mvp{display:none!important}html.ph-all .ocv-all{display:inline-flex!important}html.ph-smallest .ocv-smallest{display:inline-flex!important}html.ph-pre-mvp .ocv-pre-mvp{display:inline-flex!important}html.ph-mvp .ocv-mvp{display:inline-flex!important}.ocb{display:inline-flex;align-items:center;gap:3px;font:700 10.5px Inter,sans-serif;color:#7a3e00;background:#ffe9c7;border:1px solid #f1c27a;border-radius:99px;padding:1px 7px;margin-left:5px;vertical-align:middle;white-space:nowrap}.phbtn{font:600 12px Inter,sans-serif;padding:4px 10px;border-radius:99px;border:1px solid #d7d5cf;background:#fff;cursor:pointer}.phbtn.on{background:#10a364;color:#fff;border-color:#10a364}html.ph-smallest [data-ph]:not([data-ph="all"]):not([data-ph~="smallest"]){display:none!important}html.ph-pre-mvp [data-ph]:not([data-ph="all"]):not([data-ph~="pre-mvp"]){display:none!important}html.ph-mvp [data-ph]:not([data-ph="all"]):not([data-ph~="mvp"]){display:none!important}.p1b.p0{background:#d97706}.p1b.p2{background:#6d5bd0}.p1b{display:inline-block;font:700 9.5px Inter,sans-serif;color:#fff;background:#10a364;border-radius:5px;padding:1px 4px;margin-left:4px;vertical-align:middle}</style></head><body>

<div class="sp2"><iframe id="L" title="Site map"></iframe><div class="gut" title="Drag to resize"></div><iframe id="R" title="States of the selected screen"></iframe></div><script>window.PU_PHASES={"ids": ["smallest", "pre-mvp", "mvp"], "latest": "mvp", "labels": {"smallest": "Phase 0 (smallest)", "pre-mvp": "Phase 1 (pre-MVP)", "mvp": "Phase 2 (MVP)"}, "badges": {"smallest": "0", "pre-mvp": "1", "mvp": "2"}, "aliases": {"smallest": "smallest", "0": "smallest", "ph0": "smallest", "p0": "smallest", "pre-mvp": "pre-mvp", "1": "pre-mvp", "ph1": "pre-mvp", "p1": "pre-mvp", "mvp": "mvp", "2": "mvp", "ph2": "mvp", "p2": "mvp"}};/* Phase filter shared by the flows/site views [M1047-draft].
   window.PU_PHASES = {ids, latest, labels, badges, aliases} is injected at build time.
   data-ph is a space-separated list of phase ids the item is available in, or "all".
   Choice lives in localStorage "pu-ph1": "all" or a phase id. Legacy values 0/p0/1/2 still resolve. */
(function(){
  var C=window.PU_PHASES||{ids:["smallest","pre-mvp","mvp"],latest:"mvp",labels:{},badges:{"smallest":"0","pre-mvp":"1","mvp":"2"},aliases:{"0":"smallest","p0":"smallest","ph0":"smallest","1":"pre-mvp","2":"mvp"}};
  var K="pu-ph1",h=document.documentElement;
  function resolve(v){ if(!v||v==="0"||v==="all"||v==="latest") return "all"; return (C.aliases&&C.aliases[v])||v; }
  function v(){ try{ return resolve(localStorage.getItem(K)); }catch(e){ return "all"; } }
  function label(o){
    if(o==="all") return "Phase: all";
    var i=(C.ids||[]).indexOf(o), lab=(C.labels&&C.labels[o])||o;
    if(i<=0) return "Phase: "+lab;
    return "Phase: ≤"+((C.badges&&C.badges[o])||lab);
  }
  function ap(){
    var o=v();
    (C.ids||[]).forEach(function(id){ h.classList.remove("ph-"+id); });
    h.classList.remove("ph0only","ph1only","ph2only","ph-all");
    if(o==="all") h.classList.add("ph-all");
    else h.classList.add("ph-"+o);
    document.querySelectorAll(".phbtn").forEach(function(b){
      b.textContent=label(o);
      b.title="Click to cycle All → each phase";
      b.classList.toggle("on", o!=="all");
    });
    dispatchEvent(new Event("phchange"));
  }
  window.phToggle=function(){
    var cur=v(), ids=["all"].concat(C.ids||[]), n=ids.indexOf(cur);
    var next=ids[(n+1)%ids.length];
    try{ localStorage.setItem(K, next); }catch(e){}
    ap();
  };
  window.puResolvePhase=resolve;
  addEventListener("storage",function(e){ if(e.key===K) ap(); });
  document.addEventListener("DOMContentLoaded",ap); ap();
})();
</script><script>var L=document.getElementById("L"),R=document.getElementById("R"),cur={};

function push(s,k){cur={s:s,k:k||""};history.replaceState(null,"","#screen="+s+(k?"&st="+encodeURIComponent(k):""))}

 if(d.st&&e.source===R.contentWindow){if(d.st===cur.s&&(d.k||"")===cur.k)return;var ch=d.st!==cur.s;push(d.st,d.k);if(ch)L.contentWindow.postMessage({pick:d.st},"*")}});
var H=hp();push(H.s,H.k);L.src="sitemap.html?embed=1#"+H.s;R.src="states.html?embed=1#screen="+H.s+(H.k?"&st="+encodeURIComponent(H.k):"");
addEventListener("hashchange",function(){var H=hp();push(H.s,H.k);L.contentWindow.postMessage({pick:H.s},"*");R.contentWindow.postMessage({show:H.s,k:H.k},"*")});
var g=document.querySelector(".gut");g.onmousedown=function(e){e.preventDefault();L.style.pointerEvents=R.style.pointerEvents="none";
 function mv(e){L.style.width=Math.max(15,Math.min(80,e.clientX/innerWidth*100))+"%"}function up(){removeEventListener("mousemove",mv);removeEventListener("mouseup",up);L.style.pointerEvents=R.style.pointerEvents=""}
 addEventListener("mousemove",mv);addEventListener("mouseup",up)};</script></body></html>
