<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site map + states · PostUp mockups</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:13px Inter,system-ui,sans-serif;background:#f4f3ef}.xb{height:40px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#fff;border-bottom:1px solid #e4e2dc}
.xb a{color:#0b7a4b;text-decoration:none}.xb b{font-size:15px}.xb .mu{color:#77756f;font-size:12px}.sp2{display:flex;height:calc(100vh - 40px)}.sp2 iframe{border:0;height:100%;display:block}
#L{width:40%;min-width:240px}#R{flex:1;min-width:0}.gut{width:7px;cursor:col-resize;background:#e4e2dc;flex:none}.gut:hover{background:#10a364}
@media(max-width:820px){.sp2{flex-direction:column;height:auto}#L{width:100%!important;height:55vh}#R{height:100vh}.gut{display:none}}.phbtn{font:600 12px Inter,sans-serif;padding:4px 10px;border-radius:99px;border:1px solid #d7d5cf;background:#fff;cursor:pointer}.phbtn.on{background:#10a364;color:#fff;border-color:#10a364}html.ph1only [data-ph="0"]{display:none!important}.p1b{display:inline-block;font:700 9.5px Inter,sans-serif;color:#fff;background:#10a364;border-radius:5px;padding:1px 4px;margin-left:4px;vertical-align:middle}</style></head><body>
<div class="xb"><a href="../index.html#index">← Mockups</a><b>Site map + states</b><span class="mu">Click a screen on the map; its 336 site states total, per screen on the right. Drag the divider to resize.</span><span style="flex:1"></span><button class="phbtn" onclick="phToggle()">Phase: all</button><a href="sitemap.html">Site map</a><a href="states.html">States list</a><a href="site.html">Site graph</a></div>
<div class="sp2"><iframe id="L" title="Site map"></iframe><div class="gut" title="Drag to resize"></div><iframe id="R" title="States of the selected screen"></iframe></div><script>/* Phase filter shared by the flows/site views (Martin, Oct 27 2026 [M1031-draft]): "Phase 1" hides items marked data-ph="0".
   Choice lives in localStorage "pu-ph1" and syncs across open pages and iframes (storage event). */
(function(){var K="pu-ph1",h=document.documentElement;function on(){try{return localStorage.getItem(K)==="1"}catch(e){return false}}
function ap(){var o=on();h.classList.toggle("ph1only",o);document.querySelectorAll(".phbtn").forEach(function(b){b.textContent=o?"Phase: 1 only":"Phase: all";b.classList.toggle("on",o)});dispatchEvent(new Event("phchange"))}
window.phToggle=function(){try{localStorage.setItem(K,on()?"0":"1")}catch(e){}ap()};
addEventListener("storage",function(e){if(e.key===K)ap()});document.addEventListener("DOMContentLoaded",ap);ap()})();
</script><script>var L=document.getElementById("L"),R=document.getElementById("R"),cur={};
function hp(){var h=new URLSearchParams(location.hash.slice(1));return{s:h.get("screen")||"home",k:h.get("st")||""}}
function push(s,k){cur={s:s,k:k||""};history.replaceState(null,"","#screen="+s+(k?"&st="+encodeURIComponent(k):""))}
addEventListener("message",function(e){var d=e.data||{};
 if(d.sm&&e.source===L.contentWindow){if(d.sm===cur.s)return;push(d.sm,"");R.contentWindow.postMessage({show:d.sm},"*")}
 if(d.st&&e.source===R.contentWindow){if(d.st===cur.s&&(d.k||"")===cur.k)return;var ch=d.st!==cur.s;push(d.st,d.k);if(ch)L.contentWindow.postMessage({pick:d.st},"*")}});
var H=hp();push(H.s,H.k);L.src="sitemap.html?embed=1#"+H.s;R.src="states.html?embed=1#screen="+H.s+(H.k?"&st="+encodeURIComponent(H.k):"");
addEventListener("hashchange",function(){var H=hp();push(H.s,H.k);L.contentWindow.postMessage({pick:H.s},"*");R.contentWindow.postMessage({show:H.s,k:H.k},"*")});
var g=document.querySelector(".gut");g.onmousedown=function(e){e.preventDefault();L.style.pointerEvents=R.style.pointerEvents="none";
 function mv(e){L.style.width=Math.max(15,Math.min(80,e.clientX/innerWidth*100))+"%"}function up(){removeEventListener("mousemove",mv);removeEventListener("mouseup",up);L.style.pointerEvents=R.style.pointerEvents=""}
 addEventListener("mousemove",mv);addEventListener("mouseup",up)};</script></body></html>
