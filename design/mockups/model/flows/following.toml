# Flow: Follow a person or project. Model [M1030]; phase 2 [M1031-draft].
id = "following"
name = "Follow a person or project"
role = "joiner"
user = "registered"  # newcomer = signed out, never used; registered = signed in
situation = "rg-coming-back"  # model/situations.toml [M1031-draft]
order = 15  # position in the flow list
status = "draft"
persona = "Signed-in user who liked someone's work."
goal = "Hear when they post up next. [M1024]"
intent = "Likes someone's work"
start = { screen = "profile", auth = "in", live = "none", device = "phone", url = "/u/maya" }
edge_cases = [
  "Signed out: Follow → sign-in sheet. [FS]",
]
success = [
  "Follow alerts arrive. [M1024]",
]
decide = [
  "Alert for \"people you follow post up\" is saved but not sent yet in the build. [unsourced]",
]

[[steps]]
arrive = "opens a profile"
expect = "profile@in.none"
thought = "Likes someone's work"
shows = "Follow → Following. [FS]"

[[steps]]
link = "profile:project"
act = "taps Maya's project"
expect = "project@in.none"
thought = "Wants to see what else is being built"
shows = "Profile has no tab bar (as in the app), so: project first, then the Projects tab. [M1031-draft]"
[[steps]]
link = "tabbar:projects"
act = "taps Projects"
expect = "projects@in.none"
thought = "Wants to see who they follow"
shows = "Projects → Following filter. [FS] [R32]"
[[steps]]
event = "followed-goes-live"
act = "later: someone they follow posts up"
expect = "activity@in.live"
thought = "Hears that someone posted up"
shows = "Later: \"Maya posted up\" alert. [FS] [M1024] Event \"someone you follow posts up\": the alert lands in Activity and Nearby now has someone live. [M1031-draft]"
[[steps]]
link = "activity:postup"
act = "taps the alert"
expect = "postup@in.live"
thought = "Wants to go"
shows = "Opens and joins. [FS]"
