mvp = true
status = "draft"
persona = "Anyone viewing a postup."
goal = "Clear state and a next step. [F060] [M1024]"
intent = "Wanted to join; it's full"
start = { screen = "postup-full", auth = "in", live = "live", device = "phone", url = "/p/…" }
