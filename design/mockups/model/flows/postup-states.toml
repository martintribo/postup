# Flow: Postup ends, fills or is cancelled while you look. Model [M1030]; phase 2 [M1031-draft].
id = "postup-states"
name = "Postup ends, fills or is cancelled while you look"
role = "joiner"
user = "registered"  # newcomer = signed out, never used; registered = signed in
order = 19  # position in the flow list
status = "draft"
persona = "Anyone viewing a postup."
goal = "Clear state and a next step. [F060] [M1024]"
intent = "Wanted to join; it's full"
start = { screen = "postup-full", auth = "in", live = "live", device = "phone", url = "/p/…" }
edge_cases = [
]
success = [
  "Never a blank page. [F060]",
]
decide = [
]

[[steps]]
arrive = "opens a full postup"
expect = "postup-full@in.live"
thought = "Wanted to join; it's full"
shows = "Full. [F060] [R47]"

[[steps]]
event = "postup-cancelled"
act = "later: postup cancelled"
expect = "postup-cancelled@in.live"
thought = "Host cancelled"
shows = "Cancelled. [F060] [R47]"

[[steps]]
link = "postup-cancelled:back"
act = "taps Back"
expect = "postup-full@in.live"
thought = "Checks the other postup"
shows = "Back to the full postup (split: a cancelled postup doesn't later end). [M1031-draft]"
[[steps]]
event = "postup-ends"
act = "later: postup ended"
expect = "postup-ended@in.live"
thought = "Too late; it ended"
shows = "Ended: see what's nearby, follow. [drawn] Ending is this postup's status; others may still be live nearby. [M1031-draft]"