  "The poster ended or cancelled first: #postup-cancelled. [F060]",
]
success = [
  "Poster knows. [FS]",
]
decide = [
]

[[steps]]
arrive = "opens their joined postup"
expect = "joined@in.live"
thought = "Plans changed"
