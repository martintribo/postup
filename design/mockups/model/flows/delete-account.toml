# Flow: Delete account. Model [M1030]; phase 2 [M1031-draft].
id = "delete-account"
name = "Delete account"
role = "account"
mvp = true
order = 22  # position in the flow list
status = "draft"
persona = "Signed-in user leaving."
goal = "Remove profile, postups and projects. [M1024]"
intent = "Leaving PostUp"
start = { screen = "me", auth = "in", live = "none", device = "phone", url = "/me" }
edge_cases = [
  "Deleting while live: postup ends and joiners are alerted? [unsourced]",
]
