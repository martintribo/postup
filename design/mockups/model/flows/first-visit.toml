# Flow: First visit (newcomer). One flow for every way a newcomer first arrives [M1041]: someone live nearby (main path),
# nobody live, or a shared link (live or ended); then the ways they go on. Folds look-around, empty-area-newcomer, invite-live
# and first-post; their old URLs redirect to the matching branch.
id = "first-visit"
name = "First visit"
role = "joiner"
phase = 0  # smallest MVP [M1037]
user = "newcomer"
situation = "nc-looking"
order = 1
status = "draft"
aliases = ["look-around", "first-visit-live", "curious-browser", "stumbled"]  # old flow ids; their pages redirect here
persona = "First-time visitor, signed out. Arrives at / (someone live nearby or not) or from a link a friend sent."
goal = "Understand PostUp from the first screen, whatever the area looks like, then join someone, post up, or leave. [M1024] [M1032] [M1041]"
intent = "Curious what this is; sees people live"
outcome = "Joined [M1041]"
result = "goal:joined-postup"  # typed outcome [M1042]
goals = true  # tracks the newcomer goals in model/goals.toml [M1042]
way = "home-live"  # model/ways.toml [M1044]
edge_cases = ["Switches to Building mode for the welcome line and projects: phase 2, since projects are phase 2. [M1034]", "Joins straight from Live now: taps a live row, Join 🔒, sign-in sheet, joined in one go (was Curious visitor joins someone live). [FS] [M1018] [M1024]", "Follows the maker instead of joining: Follow 🔒 → sign-in sheet → signed in and following (was Curious browser). [FS] [M1025]", "No idea what PostUp is: taps the first live person, then the cafe, to understand by example (was Stumbled on it). [FS] [M1025]", "Nobody live: Home opens in Building, so the flow starts at the projects (merged from the old first-visit-none flow). [M1018b] [M1025]", "Taps Post up in the tab bar from any entry: the Post up branches (Post up is in the tab bar, so every entry can post up). [M1025] [M1043]", "Not now on the sheet: stays signed out, nothing lost. [drawn] [M1025]", "Never empty or \"quiet\" copy when nothing is live. [F035] [R4]", "Nobody live: Home opens in Building, where the welcome line shows first. [M1018b] [drawn] [M1025]", "Dismisses the welcome (×): it should stay dismissed. [drawn] [unsourced]", "Leaves after the first screen: the value has to be clear without scrolling. [M1025]", "Not now on the sheet: stays on the postup, still signed out. [drawn] [M1024]", "Switches to Building to look at projects first. [M1018b] [M1024]"]
success = ["No sign-in before an action. [FS]", "After sign-in the original action completes. [M1018] [M1024]", "Sees live and past content without signing in. [FS] [M1025]", "Sign-in asked only at an action (Follow). [FS] [TK§1]", "Knows what PostUp is from the first screen in either mode. [M1025]", "Reaches a live postup or a project in one tap, no sign-in. [FS] [M1025]"]
decide = [
  "No share links in phase 0: the shared-link ways in (#invite, #invite-ended) and every Share button are phase 1+. [M1046]",
]

[[steps]]
arrive = "arrives at /"
expect = "home@out.live.live"
thought = "Curious what this is; sees people live"
shows = "Home in Live mode: map + Live now. [M1018b] [M1025]"

[[steps]]
link = "home:postup-2"
act = "taps Maya's live row"
expect = "postup@out.live"
thought = "What is she doing?"
shows = "Her live postup: who, cafe, till when; Join shows 🔒. Projects are phase 2, so the newcomer learns by example from a live postup. [FS] [M1024] [M1034]"

[[steps]]
link = "postup:profile"
act = "taps Maya"
expect = "profile@out.live"
thought = "Who is behind it?"
shows = "Maker's profile: past postups, regular cafes, live now. [FS] [F065] [M1025]"

[[steps]]
link = "profile:postup"
act = "taps Live at Bean Theory"
expect = "postup@out.live"
thought = "She's live right now"
shows = "Her live postup; Join shows 🔒. [FS] [M1024]"

[[steps]]
use = "join-signin"

# ---- ways to go on from someone live nearby ----
[[outcomes]]
id = "not-now"
result = "drop:im-coming"  # [M1042]
label = "Leaves without signing in"
at = 5
when = "Taps Not now on the sign-in sheet; stays signed out, nothing lost. [drawn] [M1041]"

[[outcomes.steps]]
link = "signin:not-now"
act = "taps Not now"
expect = "postup@out.live"
thought = "Not ready to make an account"
shows = "Back on the postup, still signed out; they can leave. [drawn] [M1025] [M1041]"

[[outcomes]]
id = "browse"
result = "drop:saw-postup"  # [M1042]
label = "Browses Nearby"
at = 1
when = "Wants a list of who's around instead of the map. [M1041]"

[[outcomes.steps]]
link = "tabbar:nearby"
act = "taps Nearby"
expect = "quiet-feed@out.live"
thought = "Wants to see everyone around"
shows = "Nearby list of postups. [FS] [M1041]"

[[outcomes]]
id = "live-post"
result = "goal:posted-up"  # [M1043]
label = "Posts up instead"
at = 1
situation = "nc-at-cafe"
when = "People are live, but they're at a cafe themselves and tap Post up in the tab bar. [M1025] [M1043]"

[[outcomes.steps]]
use = "post-up-signin"
via = "tabbar:post-up"
live = "live"

[[outcomes]]
id = "live-too-far"
result = "drop:signed-up"  # [M1043]
label = "Too far away"
from = "live-post"
at = 5
situation = "nc-at-cafe"
when = "Posting up with people live nearby, but the chosen cafe is not near them. [M1039] [M1043]"

[[outcomes.steps]]
use = "too-far"
via = "signin:continue-with-apple"
live = "live"

[[outcomes]]
id = "live-already-posted"
result = "drop:signed-up"  # [M1043]
label = "Already posted up"
from = "live-post"
at = 5
situation = "nc-at-cafe"
when = "Posting up with people live nearby, but their account already has a live postup. [M1039] [M1043]"

[[outcomes.steps]]
use = "already-posted"
via = "signin:continue-with-apple"
live = "live"

# ---- phase 2: follows project content (the likeliest goal for a newcomer) ----
[[outcomes]]
id = "follow-project"
result = "goal:project"  # [M1042]
label = "Follows a maker"
at = 1
phase = 2  # projects are phase 2 [M1034]
when = "More curious about what people are making than going somewhere now; follows the maker from a project. [M1042]"

[[outcomes.steps]]
use = "building-project"
follow = "follow-maker-signin"
live = "live"

# ---- start branch: nobody live nearby ----
[[outcomes]]
id = "nobody"
result = "drop:saw-post-invite"  # [M1042]
label = "Looks at past postups"
at = 0
way = "home-none"  # [M1044]
situation = "nc-nobody-live"
aliases = ["empty-area-newcomer"]

[[outcomes.steps]]
arrive = "arrives at /"
expect = "home@out.none.live"
thought = "Nobody around right now"
shows = "Home with nobody live: map of cafes and a Post up invite (no Building mode in phase 1). [M1018c] [M1035]"

[[outcomes.steps]]
event = "empty-area"
act = "area has no postups"
expect = "empty-area@out.none"
thought = "What happens around here?"
shows = "Nobody's live nearby: Recently nearby (past postups), then cafes to be the first. Projects nearby are phase 2. [M1034] [M1032]"

[[outcomes.steps]]
link = "empty-area:maya"
act = "taps Maya posted up at Bean Theory"
expect = "profile@out.none"
thought = "Who comes here?"
shows = "Maya's profile: regular cafes, past postups. [FS] [M1032]"

[[outcomes.steps]]
link = "profile:back"
act = "taps Back"
expect = "empty-area@out.none"
thought = "Back to the area"
shows = "The empty-area screen again. [M1032]"

[[outcomes]]
id = "post"
result = "goal:posted-up"  # [M1042]
label = "Posted up"
from = "nobody"
at = 1
when = "Nobody's around, so they post up themselves (or came to post up). [M1025] [M1041]"
situation = "nc-at-cafe"
aliases = ["first-post"]

[[outcomes.steps]]
use = "post-up-signin"
via = "home:post-up"
live = "none"

[[outcomes]]
id = "too-far"
result = "drop:signed-up"  # [M1042]
label = "Too far away"
from = "post"
at = 5
situation = "nc-at-cafe"
when = "The chosen cafe is not near where they are (location check). [M1039] [M1040]"
aliases = ["too-far", "first-post--too-far"]  # was its own flow (registered); folded here [M1040]
success = ["They can't post up somewhere they're not, and are sent to pick a cafe near them. [M1039]"]

[[outcomes.steps]]
use = "too-far"
via = "signin:continue-with-apple"
live = "none"

[[outcomes]]
id = "already-posted"
result = "drop:signed-up"  # [M1042]
aliases = ["first-post--already-posted"]
situation = "nc-at-cafe"
label = "Already posted up"
from = "post"
at = 5
when = "The account they sign in with already has a live postup (a returning poster signed out on this device). [M1039] [M1040]"
success = ["One live postup per account; they land on a way to view the one they have. [M1039]"]

[[outcomes.steps]]
use = "already-posted"
via = "signin:continue-with-apple"
live = "none"

[[outcomes]]
id = "nobody-project"
result = "goal:project"  # [M1043]
label = "Follows a maker"
from = "nobody"
at = 1
phase = 2  # projects are phase 2 [M1034]
when = "Nobody's live, so they look at what people are building and follow a maker. [M1018b] [M1043]"

[[outcomes.steps]]
use = "building-project"
follow = "follow-maker-signin"
live = "none"

# ---- start branches: opened a shared link ----
[[outcomes]]
id = "link-live"
phase = 1  # shared links are phase 1+ (Martin, Nov 1 2026) [M1046]
result = "goal:joined-postup"  # [M1042]
label = "Joined from a shared link"
at = 0
way = "link-live"  # [M1044]
situation = "nc-postup-link"
aliases = ["invite-live"]

[[outcomes.steps]]
arrive = "opens the share link"
expect = "invite@out.live"
thought = "A friend sent this; knows the context"
shows = "Landing for the shared postup. [FS] [R39]"

[[outcomes.steps]]
link = "invite:join-maya"
act = "taps Join 🔒"
expect = "invite+signin@out.live"
thought = "Wants to join the friend"
shows = "Join → sign-in sheet. [FS] [M1024]"

[[outcomes.steps]]
link = "signin:continue-with-apple"
act = "signs in"
expect = "joined@in.live"
thought = "Signed in; going"
shows = "Joined. [FS] [M1024]"

[[outcomes]]
id = "link-post"
phase = 1  # shared links are phase 1+ (Martin, Nov 1 2026) [M1046]
result = "goal:posted-up"  # [M1043]
label = "Posts up at that cafe"
from = "link-live"
at = 1
situation = "nc-at-cafe"
when = "Can't join the friend, but is at a cafe: opens the cafe from the link and taps Post up here. [M1043]"

[[outcomes.steps]]
link = "invite:cafe"
act = "taps Bean Theory"
expect = "cafe@out.live"
thought = "What's this cafe like?"
shows = "The cafe page, with Post up here and the tab bar. [FS] [M1043]"

[[outcomes.steps]]
use = "post-up-signin"
via = "cafe:post-up-here"
live = "live"

[[outcomes]]
id = "link-project"
phase = 2  # projects are phase 2 [M1034]; shared links phase 1+ [M1046]
result = "goal:project"  # [M1043]
label = "Follows the friend's project"
from = "link-live"
at = 1
when = "More interested in what the friend is making: opens the project on the link and follows the maker. [M1043]"

[[outcomes.steps]]
link = "invite:star-fox-64-mod"
act = "taps Star Fox 64 mod"
expect = "project@out.live"
thought = "So that's what Maya is working on"
shows = "Project page from the shared postup. [FS] [M1043]"

[[outcomes.steps]]
use = "follow-maker-signin"
live = "live"

[[outcomes]]
id = "link-ended"
phase = 1  # shared links are phase 1+ (Martin, Nov 1 2026) [M1046]
result = "goal:joined-postup"  # [M1043]
label = "Ended link, joins someone nearby"
at = 0
way = "link-ended"  # [M1044]
situation = "nc-postup-link"

[[outcomes.steps]]
arrive = "opens the share link"
expect = "invite-ended@out.live"
thought = "Too late for this one"
shows = "This postup ended; See what's nearby, Follow Maya for next time, Go to Home. [FS] [M1032]"

[[outcomes.steps]]
link = "invite-ended:see-what-s-nearby"
act = "taps See what's nearby"
expect = "quiet-feed@out.live"
thought = "Who else is around?"
shows = "Nearby list of postups. [FS] [M1041]"

[[outcomes.steps]]
use = "nearby-cafe-postup"

[[outcomes.steps]]
use = "join-signin"

[[outcomes]]
id = "ended-not-now"
phase = 1  # shared links are phase 1+ (Martin, Nov 1 2026) [M1046]
result = "drop:im-coming"  # [M1043]
label = "Ended link, leaves without signing in"
from = "link-ended"
at = 5
when = "Taps Not now on the sign-in sheet after trying to join someone else. [drawn] [M1043]"

[[outcomes.steps]]
link = "signin:not-now"
act = "taps Not now"
expect = "postup@out.live"
thought = "Was only going for the friend"
shows = "Back on the postup, still signed out. [drawn] [M1043]"

[[outcomes]]
id = "ended-post"
phase = 1  # shared links are phase 1+ (Martin, Nov 1 2026) [M1046]
result = "goal:posted-up"  # [M1043]
label = "Posts up instead"
from = "link-ended"
at = 2
situation = "nc-at-cafe"
when = "Missed the friend, so they post up themselves from Nearby. [M1043]"

[[outcomes.steps]]
use = "post-up-signin"
via = "quiet-feed:post-up"
live = "live"

[[outcomes]]
id = "ended-project"
phase = 2  # projects are phase 2 [M1034]; shared links phase 1+ [M1046]
result = "goal:project"  # [M1043]
label = "Follows a maker"
from = "link-ended"
at = 2
when = "Nearby shows what people are making; they open a project and follow the maker. [M1043]"

[[outcomes.steps]]
link = "quiet-feed:star-fox-64-mod"
act = "taps Star Fox 64 mod"
expect = "project@out.live"
thought = "What's this?"
shows = "Project page from Nearby. [FS] [M1043]"

[[outcomes.steps]]
use = "follow-maker-signin"
live = "live"
