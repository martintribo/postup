# Flow: Hosting live: extend, edit, end. Model [M1030]; migrated from gen/flowdata.py.
id = "hosting"
name = "Hosting live: extend, edit, end"
role = "host"
mvp = true
status = "draft"
persona = "Signed-in poster who is live."
goal = "Manage time and end cleanly. [M1024]"
intent = "Live; wants more time"
start = { screen = "live", auth = "in", live = "live", device = "phone", url = "/live" }
edge_cases = [
  "Time runs out: ends automatically, chat stays 24h. [R31] [FS]",
  "Closes \"who can join\" (full): new visitors see #postup-full. [F060] [R47]",
]
success = [
  "Joiners always know the postup ended. [FS] [M1024]",
]
decide = [
]

[[steps]]
arrive = "opens their live postup"
expect = "live@in.live"
thought = "Live; wants more time"
shows = "+30 min extends. [FS]"

[[steps]]
link = "live:edit-post-edit"  # taps Edit
expect = "post-edit@in.live"
thought = "Plans changed: different time"
shows = "Edit cafe/what/until; Save → #live. [FS] [drawn]"

[[steps]]
link = "post-edit:save-live"  # taps Save
expect = "live@in.live"
thought = "Saved"
shows = "Back on live. [FS]"

[[steps]]
link = "live:end-postup-endlive"  # taps End postup
expect = "live+endlive@in.live"
thought = "Wrapping up"
shows = "End postup → confirm; joiners and waiters alerted. [FS] [drawn]"

[[steps]]
gap = "confirms End now"  # no single link/event from live+endlive@in.live to me@in.none
expect = "me@in.none"
thought = "Done for today"
shows = "Back home. [M1024]"
