# Flow: Project builder: create, update, post up for it. Model [M1030]; phase 2 [M1031-draft].
id = "project-builder"
name = "Project builder: create, update, post up for it"
role = "host"
user = "registered"  # newcomer = signed out, never used; registered = signed in
order = 14  # position in the flow list
status = "draft"
persona = "Signed-in maker."
goal = "Have a project page that collects updates and postups. [M1024]"
intent = "Wants a home for their project"
start = { screen = "projects", auth = "in", live = "none", device = "phone", url = "/projects" }
edge_cases = [
  "Signed out: Create / Post update open the sign-in sheet, form kept. [FS] [M1018]",
  "Signed out attach: #attach-signin. [FS]",
]
success = [
  "Updates and postups show on the project timeline. [FS] [M1024]",
]
decide = [
  "Image storage for projects (Vercel Blob?). [TK§4]",
]

[[steps]]
arrive = "opens Projects"
expect = "projects@in.none"
thought = "Wants a home for their project"
shows = "Projects, \"+\". [FS]"

[[steps]]
link = "projects:new-project"
act = "taps New project"
expect = "project-new@in.none"
thought = "Starts a new project page"
shows = "Cover, name, kind, one line. [FS] [drawn]"

[[steps]]
link = "project-new:create"
act = "taps Create"
expect = "project@in.none"
thought = "Project exists"
shows = "New project page. [FS]"

[[steps]]
link = "project:update"
act = "taps Update"
expect = "project-update@in.none"
thought = "Sharing progress"
shows = "Post an update with image. [FS] [R35]"

[[steps]]
link = "project-update:back"
act = "taps Back"
expect = "project@in.none"
thought = "Update can wait; post up first"
shows = "Back on the project (Update has no Post up link, as in the app). [M1031-draft]"
[[steps]]
link = "project:post-up-for-this"
act = "taps Post up for this"
expect = "project-attach@in.none"
thought = "Working on it at a cafe"
shows = "Post up for this project, now or earlier today. [FS]"
[[steps]]
link = "project-attach:post-up"
act = "taps Post up"
expect = "posted@in.none"
thought = "Live for the project"
shows = "Posted, tied to the project. [FS]"
