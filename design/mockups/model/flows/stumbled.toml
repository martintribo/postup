# Flow: Stumbled on it: what is this?. Model [M1030]; migrated from gen/flowdata.py.
id = "stumbled"
name = "Stumbled on it: what is this?"
role = "joiner"
mvp = true
status = "draft"
persona = "First-time visitor with no idea what PostUp is; arrived from search, a social post or a word-of-mouth link."
goal = "Understand PostUp within the first screen and reach something real before any sign-in. [M1025]"
intent = "No idea what PostUp is"
start = { screen = "home", auth = "out", live = "live", tab = "live", device = "phone", url = "/" }
edge_cases = [
  "Nobody live: Home opens in Building, where the welcome line shows first. [M1018b] [drawn] [M1025]",
  "Dismisses the welcome (×): it should stay dismissed. [drawn] [unsourced]",
  "Leaves after the first screen: the value has to be clear without scrolling. [M1025]",
]
success = [
  "Knows what PostUp is from the first screen in either mode. [M1025]",
  "Reaches a live postup or a project in one tap, no sign-in. [FS] [M1025]",
]
decide = [
  "Home in Live mode has no one-line explainer (only Building has the welcome). Add it to Live mode too, or a fuller \"How it works\"? [M1025]",
  "Welcome copy and when it stops showing (dismissed, signed in, after N visits). [unsourced]",
]

[[steps]]
arrive = "arrives from search or a link"
expect = "home@out.live.live"
thought = "No idea what PostUp is"
shows = "Home in Live mode: map + Live now. No explainer line is drawn in Live mode, only the brand. [drawn] [M1025]"

[[steps]]
link = "home:m-2-postup"  # taps the first live person
expect = "postup@out.live"
thought = "Trying to understand by example"
shows = "Taps the first live person to see what a postup is. [FS] [M1025]"

[[steps]]
link = "postup:bean-theory-0-4-mi-8-min-wal"  # taps the cafe
expect = "cafe@out.live"
thought = "What is this place?"
shows = "Taps the cafe: who is here now, Post up here. [FS] [M1025]"

[[steps]]
gap = "back to Home, flips to Building"  # no single link/event from cafe@out.live to home@out.live.building
expect = "home@out.live.building"
thought = "Still unsure; looks around"
shows = "Back on Home, flips to Building: the welcome line \"Post up at a cafe. See who's working nearby.\" and \"What people are building\". [drawn] [M1018c] [M1025]"

[[steps]]
link = "home:star-fox-64-mod-m-maya-yeste"  # taps a project
expect = "project@out.live"
thought = "Gets it: people work on projects at cafes"
shows = "Opens a project and gets the idea; Follow and Post up (🔒) are the next steps. [FS] [M1025]"
