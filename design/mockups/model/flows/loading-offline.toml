# Flow: Slow network and offline. Model [M1030]; phase 2 [M1031-draft].
id = "loading-offline"
name = "Slow network and offline"
role = "joiner"
user = "registered"  # newcomer = signed out, never used; registered = signed in
situation = "rg-bad-network"  # model/situations.toml [M1031-draft]
order = 21  # position in the flow list
status = "draft"
persona = "Anyone on bad wifi."
goal = "Keep showing something useful. [M1024]"
intent = "Opened the feed on bad wifi"
start = { screen = "loading", auth = "in", live = "live", device = "phone", url = "/nearby" }
edge_cases = [
  "First visit while offline: nothing cached (fails in the build today). [unsourced]",
]
success = [
  "No blank screens. [FS]",
]
decide = [
  "Full offline screen vs banner only. [R46⚠] [FS]",
]

[[steps]]
arrive = "opens Nearby"
expect = "loading@in.live"
thought = "Opened the feed on bad wifi"
shows = "Skeleton. [FS] [F060]"

[[steps]]
event = "network-drops"
act = "later: network drops"
expect = "offline@in.live"
thought = "Connection dropped"
shows = "Cached feed + offline banner + Retry. [FS]"

[[steps]]
link = "offline:retry"
act = "taps Retry"
expect = "quiet-feed@in.live"
thought = "Back online"
shows = "Retry succeeds. [FS]"

[[steps]]
link = "quiet-feed:maya-s-photo"
condition = "google-card-fails"
act = "taps a cafe"
expect = "cafe-gfail@in.live"
thought = "Checking a cafe; Google is down"
shows = "Google card failed: rest of cafe still works. [F060]"
