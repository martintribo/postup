# Flow: Share link to a live postup. Model [M1030]; phase 2 [M1031-draft].
id = "invite-live"
name = "Share link to a live postup"
role = "joiner"
phase = 1  # MVP phase [M1031-draft]
user = "newcomer"  # newcomer = signed out, never used; registered = signed in
situation = "nc-postup-link"  # model/situations.toml [M1031-draft]
order = 6  # position in the flow list
status = "draft"
persona = "Friend of a poster, signed out, opened postup.now/p/… from a message."
goal = "Join the friend who shared the link. [M1024]"
intent = "A friend sent this; knows the context"
start = { screen = "invite", auth = "out", live = "live", device = "phone", url = "/p/7xk2" }
edge_cases = [
  "The postup has ended by the time the link is opened: lands on `#invite-ended` (This postup ended; See what's nearby, Follow Maya for next time, Go to Home). Was its own flow. [M1032]",
  "Link is to an ask-to-join postup → Ask to join flow. [FS] [M1024]",
  "Already signed in: Join goes straight to joined. [TK§1] [M1024]",
]
success = [
  "The link works without an account until Join. [R39] [M1024]",
]
decide = [
]

[[steps]]
arrive = "opens the share link"
expect = "invite@out.live"
thought = "A friend sent this; knows the context"
shows = "Landing for the shared postup. [FS] [R39]"

[[steps]]
link = "invite:join-maya"
act = "taps Join 🔒"
expect = "invite+signin@out.live"
thought = "Wants to join the friend"
shows = "Join → sign-in sheet. [FS] [M1024]"

[[steps]]
link = "signin:continue-with-apple"
act = "signs in"
expect = "joined@in.live"
thought = "Signed in; going"
shows = "Joined. [FS] [M1024]"

[[steps]]
link = "joined:group-chat"
act = "opens chat"
expect = "chat@in.live"
thought = "Wants to say hi before going"
shows = "Postup chat. [F096] [M1024]"
