when = "Opens the project on the postup they joined and follows its maker. [M1044]"

[[outcomes.steps]]
link = "joined:project"
act = "taps the project"
expect = "project@in.live"
thought = "What are they working on?"
shows = "Project page. [FS] [M1044]"

[[outcomes.steps]]
