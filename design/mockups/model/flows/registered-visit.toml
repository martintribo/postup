shows = "Project page. [FS] [M1044]"

[[outcomes.steps]]
use = "follow-maker"
live = "live"

# ---- back after joining (was Leave a postup, Postup chat) ----
[[outcomes]]
id = "joined"
result = "goal:joined-postup"  # already joined on arrival (way holds it) [M1044]
label = "Leaves the postup"
at = 0
way = "joined"
phase = 1  # MVP phase [M1031-draft]
situation = "rg-after-joining"
aliases = ["leave"]

[[outcomes.steps]]
