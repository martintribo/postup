# Goals a newcomer can reach, as ordered milestone tracks [M1042]. Martin, Oct 31 2026: what matters is that people sign up and
# then post up, join a postup, or follow/post project content; most newcomers are likelier to follow projects than to go somewhere.
# Milestones are tied to screen states (fnmatch patterns on site-state ids, e.g. "postup+signin@out.*") and/or to flow steps
# that say advances = "<milestone>", or to links a screen shows (shows = [...]) [M1044]. signed-up is shared by every goal. Which
# milestones apply to which user type is data in users.toml [M1044]. Checked by gen/validate.py.
shared = [
  { id = "signed-up", label = "Signed up", states = ["*@in.*"], note = "Any signed-in state after starting signed out. [M1042]" },
]

[[goals]]
id = "posted-up"
label = "Post up"
color = "#10a364"
likely = "Least likely on a first visit: needs them to be at a cafe now and willing to host. [M1042]"
milestones = [
  { id = "saw-post-invite", label = "Saw Post up", shows = ["tabbar:post-up", "home:post-up", "quiet-feed:post-up", "cafe:post-up-here"], note = "Any screen that shows a Post up link: the tab bar is on most pages, and nobody-live Home invites them to be the first. Was a hand list of screens [M1043]; now the links themselves [M1044]. [M1032]" },
  { id = "opened-form", label = "Opened Post up", states = ["post@*"], note = "The Post up form. [FS] [M1042]" },
  { id = "picked-place", label = "Picked a place", states = ["where@*", "where-search@*"], note = "Where are you? list or search. [FS] [M1042]" },
  { id = "signed-up" },
  { id = "posted", label = "Posted up", states = ["posted@in.*"], note = "You're posted up. [FS] [M1042]" },
]

[[goals]]
id = "joined-postup"
label = "Join"
color = "#2563eb"
likely = "Likely only when someone is live nearby and they're flexible enough to go now. [M1042]"
milestones = [
  { id = "saw-postup", label = "Saw a live postup", states = ["home@*.live.live", "quiet-feed@*.live", "quiet-feed-b@*.live", "invite@*"], note = "Live now on Home, Nearby, or a shared link. [FS] [M1042]" },
  { id = "opened-postup", label = "Opened it", states = ["postup@*", "invite@*"], note = "The postup page or its share landing. [FS] [M1042]" },
  { id = "im-coming", label = "Said I'm coming", states = ["postup+signin@out.*", "invite+signin@out.*"], note = "Tapped Join; the sign-in sheet opens. [FS] [M1042]" },
  { id = "signed-up" },
  { id = "joined", label = "Joined", states = ["joined@in.*"], note = "You're joining. [FS] [M1042]" },
]

[[goals]]
id = "project"
label = "Project"
color = "#7c3aed"
phase = 2  # projects are phase 2 [M1034]
likely = "Most likely: following project content, since it doesn't need them to go anywhere now. [M1042]"
milestones = [
  { id = "saw-projects", label = "Saw projects", states = ["home@*.building", "projects@*"], shows = ["home:building", "tabbar:projects", "invite:star-fox-64-mod", "quiet-feed:star-fox-64-mod", "cafe:star-fox-64-mod", "live:star-fox-64-mod", "joined:project"], note = "Building mode, the projects list, or any screen that shows a project link (shared postup, Nearby, a cafe, hosting, joined). [M1018b] [M1042] [M1043] [M1044]" },
  { id = "opened-project", label = "Opened a project", states = ["project@*"], note = "A project page. [FS] [M1042]" },
  { id = "tapped-follow", label = "Tapped Follow", states = ["profile+signin@out.*"], note = "Follow on the maker's profile opens the sign-in sheet. [FS] [M1042]" },
  { id = "signed-up" },
  { id = "project-active", label = "Follows or posts a project", note = "Registered: follows a maker or posts a project update; reached by a step with advances. [M1044]" },
  { id = "following", label = "Following", note = "Reached by a step that says advances = \"following\" (signed in from Follow). Posting a project would also count. [M1042]" },
]
