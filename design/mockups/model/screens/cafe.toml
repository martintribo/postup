# Screen: Cafe. Model [M1030]; phase 2 [M1031-draft]: short link ids, variants map, chrome slots.
id = "cafe"
title = "Cafe"
kind = "page"
group = "Cafes & picking a place"
variants = { "live=none" = "cafe--none" }  # condition -> HTML id that renders it (first match wins)
slots = [
  { name = "sheet", kind = "sheet", accepts = ["share"] },
  { name = "nav", kind = "tab", device = "phone", accepts = ["tabbar"] },
  { name = "rail", kind = "panel", device = "desktop", accepts = ["rail"] },
]
links = [
  { id = "back", label = "Back", action = "back" },
  { id = "share", label = "Share", action = "open", to = "share", slot = "sheet" },
  { id = "bean-theory", label = "Bean Theory", action = "replace", to = "cafe", when = "live=live" },
  { id = "star-fox-64-mod", label = "Star Fox 64 mod", action = "replace", to = "project" },
  { id = "join", label = "Join", action = "replace", to = "postup", when = "live=live" },
  { id = "postup", label = "M Maya Live Bean Theory · till 4pm", action = "replace", to = "postup", when = "live=live" },
  { id = "postup-2", label = "J Jon Live Bean Theory · till 5pm", action = "replace", to = "postup", when = "live=live" },
  { id = "post-up-here", label = "Post up here", action = "replace", to = "post" },
]

