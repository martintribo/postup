# Screen: Post up. Model [M1030]; phase 2 [M1031-draft]: short link ids, variants map, chrome slots.
id = "post"
title = "Post up"
kind = "page"
group = "Posting & hosting"
slots = [
  { name = "sheet", kind = "sheet", accepts = ["signin"] },
  { name = "rail", kind = "panel", device = "desktop", accepts = ["rail"] },
]
links = [
  { id = "back", label = "Back", action = "back" },
  { id = "where", label = "Bean Theory Nearest · 0.4 mi Chang", action = "replace", to = "where" },
  { id = "project", label = "Project", action = "replace", to = "project-new", when = "phase>=2" },  # phase 2 only [M1035]
  { id = "post-up", label = "Post up", action = "open", to = "signin", slot = "sheet", then = "posted", when = "auth=out" },
  { id = "post-up", label = "Post up", action = "replace", to = "posted", when = "auth=in" },
]

[[notes]]
section = "Purpose"
lines = [
  "Post that you're working at a cafe. [FS]",
]

