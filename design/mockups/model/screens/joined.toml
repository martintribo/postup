  { name = "sheet", kind = "sheet", accepts = ["dirs", "leave"] },
  { name = "nav", kind = "tab", device = "phone", accepts = ["tabbar"] },
  { name = "rail", kind = "panel", device = "desktop", accepts = ["rail"] },
]
links = [
  { id = "close", label = "Close", action = "replace", to = "home" },
  { id = "bean-theory", label = "Bean Theory", action = "replace", to = "cafe" },
  { id = "group-chat", label = "Group chat", action = "replace", to = "chat", when = "phase>=1" },  # no chat in phase 0 [M1037]
