  { id = "back-to-map", label = "Back to map", action = "replace", to = "home" },
  { id = "cafe", label = "Cafe", action = "replace", to = "cafe" },
  { id = "project", label = "Project", action = "replace", to = "project", when = "phase>=2" },  # phase 2 only [M1035]
  { id = "leave", label = "Leave", action = "open", to = "leave", slot = "sheet", when = "phase>=1" },  # phase 0: the postup ends at its set time [M1037]
]

