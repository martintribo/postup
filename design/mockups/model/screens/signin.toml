# Sheet: Sheet · Sign in (join, ask, post, follow, create, update). Model [M1030]; phase 2 [M1031-draft].
id = "signin"
title = "Sheet · Sign in (join, ask, post, follow, create, update)"
kind = "sheet"
group = "Sheets"
host = "profile"  # page whose notes URL shows this sheet
links = [
  { id = "close", label = "", action = "close" },
  { id = "continue-with-apple", label = "Continue with Apple", action = "close", sets = "auth=in", continue = true },
  { id = "continue-with-google", label = "Continue with Google", action = "close", sets = "auth=in", continue = true },
  { id = "not-now", label = "Not now", action = "close" },
]

[[notes]]
section = "Folded pages"
lines = [
  "`#join-signin`, `#ask-signin`, `#post-signin` and `#attach-signin` are no longer pages: their button opens this sheet over the same page (`act`), and signing in continues to the action. Old links redirect here. [M1031-draft]",
]

