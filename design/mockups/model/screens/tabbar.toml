# Chrome: phone tab bar, shown in the "nav" tab slot of pages that have one. [M1031-draft]
id = "tabbar"
title = "Tab bar (phone)"
kind = "tab"
group = "Chrome"
links = [
  { id = "home", label = "Home", action = "replace", to = "home" },
  { id = "nearby", label = "Nearby", action = "replace", to = "quiet-feed" },
  { id = "post-up", label = "Post up", action = "replace", to = "post" },
  { id = "projects", label = "Projects", action = "replace", to = "projects", when = "phase>=2" },  # phase 2 only [M1035]
  { id = "inbox", label = "Inbox", action = "replace", to = "inbox", when = "phase>=1" },  # no Inbox in phase 0 [M1037]
]

[[notes]]
section = "Purpose"
lines = [
  "Phone tab bar: Map, Post up, Projects. Pages that show it declare a \"nav\" tab slot; its links are available on those pages when no sheet is open. [drawn] [M1031-draft]",
]


[[notes]]
section = "Phase versions"
lines = [
  "Phase 1 version hides: projects (phase-2 screens or Building mode). [M1035]",
]

[[notes]]
section = "Phase 0"
lines = [
  "Phase 0 version hides: inbox (no chat, so no Inbox); the tab bar is Map, Nearby, Post up. [M1037]",
]
