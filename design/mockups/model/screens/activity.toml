# Screen: Inbox · Activity. Model [M1030]; phase 2 [M1031-draft]: short link ids, variants map, chrome slots.
id = "activity"
title = "Inbox · Activity"
kind = "page"
phase = 2  # later design; phase 1 uses inbox-one [M1033]
group = "Inbox & people"
variants = { "auth=out" = "activity--out" }  # condition -> HTML id that renders it (first match wins)
slots = [
  { name = "nav", kind = "tab", device = "phone", accepts = ["tabbar"] },
  { name = "rail", kind = "panel", device = "desktop", accepts = ["rail"] },
]
links = [
  { id = "chats", label = "Chats", action = "replace", to = "inbox" },
  { id = "activity-2", label = "Activity 2", action = "replace", to = "activity" },
  { id = "postup", label = "Maya posted up at Bean Theory", action = "replace", to = "postup" },
  { id = "live", label = "D Dev asked to join your postup 2", action = "replace", to = "live" },
  { id = "live-2", label = "J Jon joined your postup 14 min ag", action = "replace", to = "live" },
