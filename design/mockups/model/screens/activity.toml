  { id = "profile", label = "A Ari followed you Mon", action = "replace", to = "profile" },
  { id = "back", label = "", action = "back", when = "auth=out" },
  { id = "continue-with-apple", label = "Continue with Apple", action = "replace", to = "activity", sets = "auth=in", when = "auth=out" },
